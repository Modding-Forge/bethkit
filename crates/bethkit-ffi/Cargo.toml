[package]
name    = "bethkit-ffi"
version = "0.4.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
bethkit-core = { path = "../bethkit-core" }
bethkit-schema = { path = "../bethkit-schema", default-features = false }
bethkit-semantic = { path = "../bethkit-semantic" }
bethkit-bsa  = { path = "../bethkit-bsa" }
bethkit-io   = { path = "../bethkit-io" }
thiserror    = { workspace = true }
serde_json   = { workspace = true }

[features]
default = []
schema-skyrim-se = ["bethkit-schema/schema-skyrim-se"]
# Enable to regenerate bethkit.h from the FFI source.
# cargo build -p bethkit-ffi --features generate-header
generate-header = ["dep:cbindgen"]

[build-dependencies]
cbindgen = { version = "0.29", optional = true }
