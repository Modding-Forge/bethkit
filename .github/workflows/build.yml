name: Build

on:
  push:
    branches: ["master", "main"]
    tags: ["v*"]
  pull_request:
    branches: ["master", "main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-latest-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-latest-cargo-lint-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Download pinned Skyrim Special Edition schema
        shell: pwsh
        run: |
          $schema = ./scripts/Get-SkyrimSeSchema.ps1
          "BETHKIT_SKYRIM_SE_SCHEMA=$schema" >> $env:GITHUB_ENV

      - name: Clippy
        run: >-
          cargo clippy --workspace --all-targets --features bethkit-ffi/schema-skyrim-se -- --deny warnings


  build:
    needs: lint
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: bethkit-windows-x64
            dll: target/release/bethkit_ffi.dll
            lib: target/release/bethkit_ffi.lib
          - os: ubuntu-latest
            artifact-name: bethkit-linux-x64
            dll: target/release/libbethkit_ffi.so
            lib: target/release/libbethkit_ffi.a

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Download pinned Skyrim Special Edition schema
        shell: pwsh
        run: |
          $schema = ./scripts/Get-SkyrimSeSchema.ps1
          "BETHKIT_SKYRIM_SE_SCHEMA=$schema" >> $env:GITHUB_ENV

      - name: Run tests
        run: >-
          cargo test --workspace --all-targets --features bethkit-ffi/schema-skyrim-se


      - name: Run doc tests
        if: matrix.os == 'ubuntu-latest'
        run: >-
          cargo test --doc --workspace --features bethkit-ffi/schema-skyrim-se


      - name: Check documentation
        if: matrix.os == 'ubuntu-latest'
        run: >-
          cargo doc --workspace --no-deps --features bethkit-ffi/schema-skyrim-se


      - name: Build release DLL
        run: >-
          cargo build --release -p bethkit-ffi --features schema-skyrim-se,generate-header


      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            ${{ matrix.dll }}
            ${{ matrix.lib }}
            crates/bethkit-ffi/bethkit.h
            target/release-schemas/skyrim_se.bkschema
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: bethkit-windows-x64
          path: dist/windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: bethkit-linux-x64
          path: dist/linux

      - name: Package artifacts
        run: |
          mkdir -p staging/windows staging/linux
          cp dist/windows/target/release/bethkit_ffi.dll staging/windows/
          cp dist/windows/target/release/bethkit_ffi.lib staging/windows/
          cp dist/windows/crates/bethkit-ffi/bethkit.h   staging/windows/
          cp dist/windows/target/release-schemas/skyrim_se.bkschema staging/windows/
          cp dist/linux/target/release/libbethkit_ffi.so staging/linux/
          cp dist/linux/target/release/libbethkit_ffi.a  staging/linux/
          cp dist/linux/crates/bethkit-ffi/bethkit.h     staging/linux/
          cp dist/linux/target/release-schemas/skyrim_se.bkschema staging/linux/
          (cd staging/windows && zip -r ../../bethkit-${{ github.ref_name }}-windows-x64.zip .)
          (cd staging/linux   && zip -r ../../bethkit-${{ github.ref_name }}-linux-x64.zip .)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            bethkit-${{ github.ref_name }}-windows-x64.zip
            bethkit-${{ github.ref_name }}-linux-x64.zip
