[workspace]
members = [
    "crates/bethkit-io",
    "crates/bethkit-core",
    "crates/bethkit-schema",
    "crates/bethkit-semantic",
    "crates/bethkit-bsa",
    "crates/bethkit-ffi",
]
resolver = "2"

[workspace.dependencies]
thiserror  = "1"
memmap2    = "0.9"
flate2     = "1"
lz4_flex   = "0.11"
bitflags   = "2"
tempfile   = "3"
ahash      = "0.8"
bstr       = "1"
rayon      = "1"
once_cell  = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium   = "0.2"
sha2       = "0.10"
hex        = "0.4"
encoding_rs = "0.8"

[profile.release]
lto           = "fat"
opt-level     = 3
codegen-units = 1
